<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alumni | UPT SD Negeri 029 Bentenna</title><link rel="stylesheet" href="style.css"><style>main{min-height:70vh}.wrap{padding:70px 0}.alumni-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;margin-top:24px}.search{width:100%;padding:13px 15px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}.table{width:100%;border-collapse:collapse;margin-top:20px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #eee}.empty{text-align:center;color:#64748b;padding:40px}</style></head><body><header class="header"><div class="container nav-wrap"><a class="brand" href="index.html"><div class="logo"><span>029</span></div><div><strong>UPT SD Negeri 029 Bentenna</strong><span>Kabupaten Luwu Utara</span></div></a><nav class="nav" style="display:flex"><a href="index.html">Beranda</a><a href="alumni.html" class="active">Alumni</a></nav></div></header><main><section class="wrap"><div class="container"><p class="eyebrow red">JEJAK LULUSAN</p><h1>Data Alumni</h1><p>Daftar alumni UPT SD Negeri 029 Bentenna.</p><div class="alumni-card"><input id="search" class="search" placeholder="Cari nama atau tahun lulus..."><div id="list"></div></div></div></section></main><footer><div class="container footer-grid"><div><strong>UPT SD Negeri 029 Bentenna</strong><p>Menginspirasi Negeri</p></div><div><p>© 2026 UPT SD Negeri 029 Bentenna</p></div></div></footer><script>const key='bentennaAlumni';function get(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function render(){let q=document.getElementById('search').value.toLowerCase(),a=get().filter(x=>(x.name+' '+x.year+' '+(x.info||'')).toLowerCase().includes(q)),box=document.getElementById('list');box.innerHTML=a.length?'<table class="table"><thead><tr><th>Nama</th><th>Tahun Lulus</th><th>Keterangan</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.year)+'</td><td>'+esc(x.info||'-')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Belum ada data alumni.</div>'}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('search').addEventListener('input',render);render();</script></body></html>
